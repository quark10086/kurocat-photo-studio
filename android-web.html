<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KuroCat Android Overlay</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #pet-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <script type="module" src="/src/androidEntry.ts"></script>
  </body>
</html>
